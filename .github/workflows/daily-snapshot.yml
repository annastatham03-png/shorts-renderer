name: Daily Snapshot

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call snapshot endpoint
        env:
          SNAPSHOT_CRON_SECRET: ${{ secrets.SNAPSHOT_CRON_SECRET }}
          SNAPSHOT_ENDPOINT: ${{ secrets.SNAPSHOT_ENDPOINT }}
        run: |
          curl -X POST "$SNAPSHOT_ENDPOINT" \
            -H "x-cron-secret: $SNAPSHOT_CRON_SECRET"
